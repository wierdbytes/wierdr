name: Wierdr
options:
  bundleIdPrefix: pw.xff
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: AUL4CCB2XY
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "8"
packages:
  WierdrKit:
    path: Packages/WierdrKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.99.3
targets:
  Wierdr:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: WierdrKit
        product: HerdrCore
      - package: WierdrKit
        product: HerdrSSH
      - package: WierdrKit
        product: WierdrModel
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pw.xff.wierdr
        PRODUCT_NAME: Wierdr
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wierdr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Wierdr connects over SSH to herdr-core on computers in your local network."
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        UIAppFonts:
          - Geist-Variable.ttf
          - JetBrainsMono-Variable.ttf
          - JetBrainsMono-Italic-Variable.ttf
          - SymbolsNerdFont-Regular.ttf
        NSBonjourServices:
          - _ssh._tcp
        UIApplicationSupportsIndirectInputEvents: true
schemes:
  Wierdr:
    build:
      targets:
        Wierdr: all
    run:
      config: Debug
    archive:
      config: Release
