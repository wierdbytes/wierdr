name: Wierdr
options:
  bundleIdPrefix: pw.xff
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: AUL4CCB2XY
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "83"
packages:
  WierdrKit:
    path: Packages/WierdrKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.99.3
targets:
  Wierdr:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: WierdrKit
        product: HerdrCore
      - package: WierdrKit
        product: HerdrSSH
      - package: WierdrKit
        product: WierdrModel
      - package: WierdrKit
        product: WierdrActivity
      - package: SwiftTerm
      - target: WierdrWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pw.xff.wierdr
        PRODUCT_NAME: Wierdr
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wierdr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Wierdr connects over SSH to herdr-core on computers in your local network."
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    entitlements:
      path: App/Wierdr.entitlements
      properties:
        aps-environment: development
        # The Live Activity's seal keys, for the widget extension (its sandbox has no keychain).
        com.apple.security.application-groups:
          - group.pw.xff.wierdr
    info:
      path: App/Info.plist
      properties:
        WierdrAppGroup: group.pw.xff.wierdr
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: pw.xff.wierdr
            CFBundleURLSchemes:
              - wierdr
        UIAppFonts:
          - Geist-Variable.ttf
          - JetBrainsMono-Variable.ttf
          - JetBrainsMono-Italic-Variable.ttf
          - SymbolsNerdFont-Regular.ttf
        NSBonjourServices:
          - _ssh._tcp
        UIApplicationSupportsIndirectInputEvents: true
        # ProMotion iPhones: animations at up to 120 Hz (else capped at 60, while scrolling runs at 120).
        CADisableMinimumFrameDurationOnPhone: true
  # The agents Live Activity (App/Widgets); `wierdr-push` on the Mac drives it.
  WierdrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
      - path: App/Resources/Icons.xcassets
    dependencies:
      - package: WierdrKit
        product: WierdrActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pw.xff.wierdr.widgets
        PRODUCT_NAME: WierdrWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wierdr
        SKIP_INSTALL: YES
    entitlements:
      path: App/Widgets/WierdrWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pw.xff.wierdr
    info:
      path: App/Widgets/Info.plist
      properties:
        WierdrAppGroup: group.pw.xff.wierdr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Wierdr:
    build:
      targets:
        Wierdr: all
    run:
      config: Debug
    archive:
      config: Release
